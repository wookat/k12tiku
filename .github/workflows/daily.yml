name: daily-update
on:
  schedule:
    - cron: "30 23 * * *"  # 07:30 Beijing time
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas pyarrow
      - run: python daily_update.py
        env:
          CF: ${{ secrets.CF_API_TOKEN }}
